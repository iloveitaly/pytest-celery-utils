[project]
name = "pytest-celery-utils"
version = "0.1.2"
description = "Pytest plugin for inspecting Celery task queues in Redis during tests"
keywords = ["pytest", "celery", "testing", "redis"]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "celery>=5.5.3",
    "kombu>=5.5.4",
    "pytest>=9.0.1",
    "redis>=5.2.0",
    "structlog-config>=0.7.0",
]
authors = [{ name = "Michael Bianco", email = "mike@mikebian.co" }]
urls = { "Repository" = "https://github.com/iloveitaly/pytest-celery-utils" }

[project.entry-points."pytest11"]
celery_utils = "pytest_celery_utils"

[build-system]
requires = ["uv_build>=0.11.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# avoids the src/ directory structure
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pyright[nodejs]>=1.1.408",
    "ruff>=0.15.0",
    "coverage>=7.13.4",
    "pytest-cov>=7.0.0",
    "covdefaults>=2.3.0",
    "beautiful-traceback>=1.0.2; python_version >= '3.12'",
]

[tool.pyright]
exclude = ["examples/", "playground/", "tmp/", ".venv/", "tests/"]

[tool.coverage.run]
plugins = ["covdefaults"]
source = ["pytest_celery_utils"]

[tool.coverage.report]
fail_under = 50
