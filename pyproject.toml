[project]
name = "pytest-celery-utils"
version = "0.1.2"
description = "Pytest plugin for inspecting Celery task queues in Redis during tests"
keywords = ["pytest", "celery", "testing", "redis"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "celery>=5.5.3",
    "kombu>=5.5.4",
    "pytest>=9.0.1",
    "redis>=5.2.0",
    "structlog-config>=0.7.0",
]
authors = [{ name = "Michael Bianco", email = "mike@mikebian.co" }]
urls = { "Repository" = "https://github.com/iloveitaly/pytest-celery-utils" }

[project.entry-points."pytest11"]
celery_utils = "pytest_celery_utils"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# avoids the src/ directory structure
module-root = ""

[dependency-groups]
dev = ["pytest>=8.3.3","pyright[nodejs]>=1.1.380","ruff>=0.8.0"]

[tool.pyright]
exclude = ["examples/", "playground/", "tmp/", ".venv/", "tests/"]

[tool.ruff]
extend-exclude = ["playground.py", "playground/"]
